<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sins of the Past — Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#d9dce2;--mute:#b8bec8;--ink-bright:#f1f4f8;--line:rgba(217,220,226,.18)}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'Press Start 2P',monospace;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
#grid{position:absolute;inset:0;background:
  linear-gradient(#111 1px,transparent 1px),
  linear-gradient(90deg,#111 1px,transparent 1px);
background-size:40px 40px;opacity:.35;transform:perspective(900px) rotateX(60deg)}
#logo{max-width:min(420px,70vw);margin:0 16px 18px;z-index:1;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 8px #ff5a5a,0 0 16px #00e0c6}to{text-shadow:0 0 20px #ff5a5a,0 0 40px #00e0c6}}
#press{font-size:14px;letter-spacing:2px;margin-top:16px;display:none;z-index:1;animation:blink 1s steps(2,start) infinite;color:var(--ink-bright);text-shadow:0 2px 12px rgba(0,0,0,.45)}
@keyframes blink{to{visibility:hidden}}
.fade{animation:fadeout .8s forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}

.card{z-index:2;width:min(480px,92vw);background:rgba(14,14,20,.9);border:2px solid #cfd5df;border-radius:12px;padding:16px;box-shadow:0 16px 36px rgba(0,0,0,.35)}
.card p{font-size:11px;line-height:1.6;margin:0 0 8px;color:var(--ink-bright);text-shadow:0 2px 12px rgba(0,0,0,.35)}
label{display:block;font-size:11px;margin:8px 0 4px;opacity:.9;color:var(--mute)}
input[type=text],input[type=email],input[type=password]{width:100%;padding:8px;border-radius:8px;border:1px solid #444;background:#0b0c13;color:var(--ink);font-family:inherit;font-size:12px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:8px;border:1px solid #444;background:#0b0c13;color:var(--ink-bright);cursor:pointer}
.btn.primary{border-color:transparent;background:#cfd5df;color:#111;font-weight:bold}
.msg{display:none;font-size:10px;color:var(--mute);margin-top:6px}

.score{display:flex;justify-content:space-between;align-items:center;border:1px solid #333;border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.score b{font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;border:1px solid #444;font-size:10px;color:var(--ink-bright)}
.util{position:fixed;bottom:10px;left:10px;z-index:3;font-size:10px;opacity:.7;color:var(--mute)}
.util a{color:var(--ink-bright);text-decoration:underline;cursor:pointer}
.footer-hint{position:fixed;bottom:10px;right:10px;z-index:3;font-size:10px;opacity:.6;color:var(--mute)}

/* cover-page cursor (paths here are relative to THIS html file) */
:root{ --cursor: url('assets/indexgrim.png') 12 12, auto; }

/* apply everywhere except typing fields */
:where(html, body, *):not(input, textarea, [contenteditable="true"]) {
  cursor: var(--cursor) !important;
}
input, textarea, [contenteditable="true"] { cursor: text !important; }

/* if you keep the visual follower .cursor, make sure it can't block clicks */
.cursor { pointer-events:none; }

</style>
</head>
<body>
<div id="grid" aria-hidden="true"></div>

<!-- Tip: avoid spaces in filenames on some hosts -->
<img id="logo" src="assets/SinsF.png" alt="Sins of the Past" onerror="this.style.display='none'">

<!-- Account access keeps the existing site behind the same intro experience. -->
<div id="accountCard" class="card" role="dialog" aria-labelledby="accountLabel" aria-modal="true">
  <p id="accountLabel">Before you enter… <b>sign in or create your account.</b></p>
  <div class="btns" style="margin-top:0">
    <button id="createModeBtn" class="btn primary" type="button">Create account</button>
    <button id="signInModeBtn" class="btn" type="button">Sign in</button>
  </div>
  <label for="accountEmail">Email:</label>
  <input id="accountEmail" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="accountPassword">Password:</label>
  <input id="accountPassword" type="password" minlength="8" autocomplete="new-password">
  <div id="confirmPasswordWrap">
    <label for="confirmPassword">Confirm password:</label>
    <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password">
  </div>
  <div class="btns">
    <button id="accountSubmit" class="btn primary" type="button">Create account</button>
    <button id="guestAccessBtn" class="btn" type="button">Continue as guest</button>
  </div>
  <div id="accountMsg" class="msg" role="status" aria-live="polite"></div>
</div>

<!-- First-time question -->
<div id="sinCard" class="card" role="dialog" aria-labelledby="sinLabel" aria-modal="true" style="display:none">
  <p id="sinLabel">Before you enter… tell us your <b>last sin</b> </p>

  <label for="sinInput">Type your answer:</label>
  <input id="sinInput" type="text" placeholder="ex: pride, greed, or your own…" autocomplete="off" autocapitalize="none">

  <div class="btns">
    <button id="saveBtn" class="btn primary">Save</button>
    <button id="skipBtn" class="btn">Skip</button>
  </div>

  <div id="msg" class="msg"></div>
</div>

<!-- Mini-game (hidden until Skip is clicked) -->
<div id="rpsGame" class="card" style="display:none;margin-top:20px">
  <div class="score">
    <div><b>Best 2 of 3</b> <span id="round" class="badge">Round 1</span></div>
    <div><span class="badge">You: <b id="pScore">0</b></span> <span class="badge">Reaper: <b id="rScore">0</b></span></div>
  </div>
  <p>Refuse to confess? Face the Reaper in <b>Rock · Paper · Scythe</b>!</p>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
    <button class="btn choice" data-move="rock">🪨 Rock</button>
    <button class="btn choice" data-move="paper">📜 Paper</button>
    <button class="btn choice" data-move="scythe">⚔️ Scythe</button>
  </div>
  <div id="rpsResult" class="msg" style="margin-top:10px"></div>
</div>

<!-- Email collection screen (hidden until sin is confessed) -->
<div id="emailCard" class="card" style="display:none;">
  <p>Before you proceed, leave your email.</p>
  <label for="emailInput">Your email:</label>
  <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="off">

  <div class="btns">
    <button id="emailBtn" class="btn primary">Enter</button>
    <button id="emailSkipBtn" class="btn">Skip for now</button>
  </div>

  <div id="emailMsg" class="msg"></div>
</div>

<div id="press" aria-hidden="true">PRESS START</div>

<div class="util">Not you? <a id="resetLink">reset intro</a></div>
<div class="footer-hint">Click or press any key to enter.</div>

<script>
/* ---------- Intro + Mini-game (Best 2 of 3) ---------- */
const KEY='stp_sin';
const params = new URLSearchParams(location.search);
const forceReset = params.get('reset')==='1';

const card  = document.getElementById('sinCard');
const accountCard = document.getElementById('accountCard');
const game  = document.getElementById('rpsGame');
const press = document.getElementById('press');
const msg   = document.getElementById('msg');
const input = document.getElementById('sinInput');
const saveBtn = document.getElementById('saveBtn');
const skipBtn = document.getElementById('skipBtn');
const emailCard = document.getElementById('emailCard');
const emailInput = document.getElementById('emailInput');
const emailBtn = document.getElementById('emailBtn');
const emailSkipBtn = document.getElementById('emailSkipBtn');
const emailMsg = document.getElementById('emailMsg');

// Game HUD elements
const pScoreEl = document.getElementById('pScore');
const rScoreEl = document.getElementById('rScore');
const roundEl = document.getElementById('round');
const resultEl = document.getElementById('rpsResult');

// Game state
let pWins = 0;
let rWins = 0;
let round = 1;
let rpsResolved = false;

// User data
const user = JSON.parse(localStorage.getItem('user')) || {
  lastSin: null,
  skipped: false,
  allowedFeatures: ['landing', 'confess', 'view_all_sins', 'view_redemption']
};

function saveUser() {
  localStorage.setItem('user', JSON.stringify(user));
}

function goToLanding() {
  window.location.href = 'home.html';
}

// Show/Hide helpers
function showCard() {
  card.style.display = 'block';
  game.style.display = 'none';
  press.style.display = 'none';
}

function showPress() {
  card.style.display = 'none';
  game.style.display = 'none';
  press.style.display = 'block';
}

function showGame() {
  card.style.display = 'none';
  game.style.display = 'block';
  press.style.display = 'none';
}

function resetMatch() {
  pWins = 0;
  rWins = 0;
  round = 1;
  rpsResolved = false;
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
  updateHUD();
}

// ===== CONFESS SIN =====
saveBtn.onclick = () => {
  const val = input.value.trim();
  if(!val){
    msg.textContent = 'Say something… or face judgment.';
    msg.style.display = 'block';
    return;
  }
  user.lastSin = val;
  user.skipped = false;
  user.allowedFeatures = ['landing', 'confess', 'view_all_sins', 'view_redemption'];
  saveUser();
  localStorage.setItem(KEY, val);
  msg.textContent = '✓ Your sin has been recorded.';
  msg.style.display = 'block';

  // Show email screen instead of going directly to home
  setTimeout(() => {
    card.style.display = 'none';
    emailCard.style.display = 'block';
  }, 1000);
};

// ===== EMAIL SUBMISSION =====
emailBtn.onclick = () => {
  const email = emailInput.value.trim();
  if(!email){
    emailMsg.textContent = 'Email required to enter.';
    emailMsg.style.display = 'block';
    return;
  }
  user.email = email;
  saveUser();
  emailMsg.textContent = '✓ Email saved. Welcome.';
  emailMsg.style.display = 'block';
  setTimeout(goToLanding, 1000);
};

// ===== SKIP EMAIL =====
emailSkipBtn.onclick = () => {
  user.email = null;
  saveUser();
  goToLanding();
};

// ===== SKIP SIN (Play Mini-Game) =====
skipBtn.onclick = () => {
  user.lastSin = null;
  user.skipped = true;
  user.allowedFeatures = ['landing', 'confess'];
  saveUser();
  localStorage.setItem(KEY, 'none');
  resetMatch();
  showGame();
};

// Init
const saved = localStorage.getItem(KEY);
if (!saved || forceReset) {
  showCard();
} else {
  showPress();
}

// ENTER SITE
function enter(){
  const onAccount = accountCard.style.display !== 'none';
  const onCard  = card.style.display !== 'none';
  const onGame  = game.style.display !== 'none';
  const onPress = press.style.display !== 'none';

  if (onAccount) return;
  if (onCard) return;
  if (onGame && !rpsResolved) return;

  sessionStorage.setItem('stp_from_cover','1');
  document.body.classList.add('fade');
  setTimeout(() => window.location.replace('./home.html'), 700);
}

// Allow enter on any key or click
document.addEventListener('keydown', enter);
document.addEventListener('click', enter);

// Reset helper
document.getElementById('resetLink').onclick = (e) => {
  e.preventDefault();
  localStorage.removeItem(KEY);
  resetMatch();
  showCard();
};

/* ----- Best-of-3 Mini-game ----- */
const moves = ["rock", "paper", "scythe"];

function resultFor(p, c){
  if (p === c) return "draw";
  if (p === "rock" && c === "scythe") return "win";
  if (p === "scythe" && c === "paper") return "win";
  if (p === "paper" && c === "rock") return "win";
  return "lose";
}

function updateHUD(){
  pScoreEl.textContent = String(pWins);
  rScoreEl.textContent = String(rWins);
  roundEl.textContent = `Round ${round}`;
}

function resolveRound(player){
  const comp = moves[Math.floor(Math.random() * moves.length)];
  const res = resultFor(player, comp);

  resultEl.style.display = "block";

  if (res === "draw"){
    resultEl.innerHTML = `You chose <b>${player}</b>, Reaper chose <b>${comp}</b> — <b>Draw</b>. Play again.`;
    return;
  }

  if (res === "win") { pWins++; }
  else { rWins++; }

  resultEl.innerHTML = `You chose <b>${player}</b>, Reaper chose <b>${comp}</b> — ` +
    (res === "win" ? "<b>You win the round.</b>" : "<b>Reaper wins the round.</b>");

  if (pWins === 2 || rWins === 2){
    rpsResolved = true;
    const who = (pWins === 2) ? "🔥 You win — the Reaper grants you passage!" : "💀 The Reaper claims victory.";
    resultEl.innerHTML += `<br>${who}`;
    setTimeout(() => {
      // The existing homepage rejects a skipped, unconfessed visitor.
      // Marking guest passage here keeps the original mini-game flow intact
      // without sending the visitor back to this index page.
      user.lastSin = 'guest';
      user.skipped = false;
      user.allowedFeatures = ['landing', 'confess', 'view_all_sins', 'view_redemption'];
      saveUser();
      enter();
    }, 1100);
    return;
  }

  round++;
  updateHUD();
}

document.querySelectorAll('.choice').forEach(btn => {
  btn.onclick = () => resolveRound(btn.dataset.move);
});

updateHUD();
</script>

<script>
/* ---------- Account gate for the existing intro site ---------- */
(function(){
  const accountCard = document.getElementById('accountCard');
  const sinCard = document.getElementById('sinCard');
  const game = document.getElementById('rpsGame');
  const emailCard = document.getElementById('emailCard');
  const press = document.getElementById('press');
  const emailInput = document.getElementById('accountEmail');
  const passwordInput = document.getElementById('accountPassword');
  const confirmInput = document.getElementById('confirmPassword');
  const confirmWrap = document.getElementById('confirmPasswordWrap');
  const createModeBtn = document.getElementById('createModeBtn');
  const signInModeBtn = document.getElementById('signInModeBtn');
  const submitBtn = document.getElementById('accountSubmit');
  const guestBtn = document.getElementById('guestAccessBtn');
  const message = document.getElementById('accountMsg');
  const accountsKey = 'sop_accounts';
  const sessionKey = 'sop_session';
  const encoder = new TextEncoder();
  let mode = 'create';

  function readAccounts(){
    try{
      const accounts = JSON.parse(localStorage.getItem(accountsKey) || '[]');
      return Array.isArray(accounts) ? accounts : [];
    }catch(error){ return [] }
  }

  function readSession(){
    try{ return JSON.parse(localStorage.getItem(sessionKey) || 'null') }
    catch(error){ return null }
  }

  function base64(bytes){
    let binary = '';
    bytes.forEach(byte => { binary += String.fromCharCode(byte) });
    return btoa(binary);
  }

  function bytes(value){
    const binary = atob(value);
    return Uint8Array.from(binary, character => character.charCodeAt(0));
  }

  async function hashPassword(password, salt){
    if(!window.crypto?.subtle) throw new Error('secure-context-required');
    const key = await window.crypto.subtle.importKey('raw', encoder.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
    const bits = await window.crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'}, key, 256);
    return base64(new Uint8Array(bits));
  }

  function setMessage(text, isError){
    message.textContent = text;
    message.style.display = text ? 'block' : 'none';
    message.style.color = isError ? '#ff9b9b' : 'var(--mute)';
  }

  function setMode(nextMode){
    mode = nextMode;
    const creating = mode === 'create';
    createModeBtn.classList.toggle('primary', creating);
    signInModeBtn.classList.toggle('primary', !creating);
    confirmWrap.style.display = creating ? 'block' : 'none';
    confirmInput.required = creating;
    passwordInput.autocomplete = creating ? 'new-password' : 'current-password';
    submitBtn.textContent = creating ? 'Create account' : 'Sign in';
    setMessage('', false);
  }

  function grantAccess(session){
    localStorage.setItem(sessionKey, JSON.stringify(session));
    let user = {};
    try{ user = JSON.parse(localStorage.getItem('user') || '{}') || {} }catch(error){ user = {} }
    user.skipped = false;
    user.email = session.email || user.email || null;
    user.allowedFeatures = ['landing', 'confess', 'view_all_sins', 'view_redemption'];
    localStorage.setItem('user', JSON.stringify(user));
  }

  function unlockIntro(){
    accountCard.style.display = 'none';
    emailCard.style.display = 'none';
    const reset = new URLSearchParams(window.location.search).get('reset') === '1';
    if(!localStorage.getItem('stp_sin') || reset) showCard();
    else showPress();
  }

  function lockIntro(){
    accountCard.style.display = 'block';
    sinCard.style.display = 'none';
    game.style.display = 'none';
    emailCard.style.display = 'none';
    press.style.display = 'none';
  }

  createModeBtn.onclick = () => setMode('create');
  signInModeBtn.onclick = () => setMode('signin');
  guestBtn.onclick = () => {
    grantAccess({type:'guest', startedAt:new Date().toISOString()});
    unlockIntro();
  };

  submitBtn.onclick = async () => {
    setMessage('', false);
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    if(!email || !emailInput.checkValidity()) return setMessage('Enter a valid email.', true);
    if(password.length < 8) return setMessage('Use at least 8 characters for your password.', true);
    if(mode === 'create' && password !== confirmInput.value) return setMessage('Passwords do not match.', true);
    submitBtn.disabled = true;
    try{
      const accounts = readAccounts();
      const existing = accounts.find(account => account.email === email);
      if(mode === 'create'){
        if(existing) throw new Error('account-exists');
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const hash = await hashPassword(password, salt);
        accounts.push({email, salt:base64(salt), hash, createdAt:new Date().toISOString()});
        localStorage.setItem(accountsKey, JSON.stringify(accounts));
        grantAccess({type:'account', email});
      }else{
        if(!existing) throw new Error('invalid-login');
        const hash = await hashPassword(password, bytes(existing.salt));
        if(hash !== existing.hash) throw new Error('invalid-login');
        grantAccess({type:'account', email});
      }
      emailInput.value = '';
      passwordInput.value = '';
      confirmInput.value = '';
      unlockIntro();
    }catch(error){
      const errors = {
        'account-exists':'That email already has an account on this browser. Choose Sign in.',
        'invalid-login':'Email or password not recognized on this browser.',
        'secure-context-required':'Account access requires HTTPS. You can still continue as guest.'
      };
      setMessage(errors[error.message] || 'Account setup failed. Please try again.', true);
    }finally{ submitBtn.disabled = false }
  };

  setMode('create');
  if(readSession()) unlockIntro();
  else lockIntro();
})();
</script>

<!-- Optional: only if you need global JS here -->
<script src="app.js"></script>
<div class="cursor"></div>
<script>
  const cursor = document.querySelector('.cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
</script>
</body>
</html>
